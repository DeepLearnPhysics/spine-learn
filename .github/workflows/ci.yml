name: Validate tutorial
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: make lint test narration-check site
      - run: .venv/bin/python scripts/verify_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: tutorial-preview
          path: _build/site/_build/html
