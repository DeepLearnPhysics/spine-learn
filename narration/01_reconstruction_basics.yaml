tutorial: reconstruction-basics
review_status: reviewed
chunks:
  - id: orientation
    section: orientation
    focus: orientation
    next_step: orientation-activity
    next_chunk: orientation-explanation
    continue_label: I've tried it — continue narration
    text: |
      Let's open one entry from this HDF5 sample. Before you run the cell,
      separate two questions: how many entries are in the file, and how many
      reconstructed interactions are in the entry we opened? Those need not
      be the same number. The reader loads stored results; the builder restores
      their links to points and to each other. We are not running reconstruction.
      Now try the cell, or inspect the saved output. Find both counts and explain
      the distinction to yourself. I'll pause here. When you're ready, select
      I've tried it, continue narration, for the explanation.
  - id: orientation-explanation
    section: orientation-explanation
    focus: orientation-explanation
    next_step: inspect-particles
    continue_label: Continue to particle inspection
    text: |
      The file has six entries, but we opened only entry zero. In that entry,
      reconstruction grouped two thousand two hundred and twenty-eight points
      into nine particle candidates and associated them with three interactions.
      An entry is a container for this example; an interaction is a reconstructed
      association within it. Don't confuse either count with the number of
      particles. And don't read a reconstructed label as proof of truth.
      Before continuing, ask yourself where you would find the points belonging
      to just one particle. If you would start from that particle's membership
      in the shared point array, you're ready for the next section. Otherwise,
      replay this explanation or read the text at your own pace.
  - id: inspect-particles
    section: inspect-particles
    text: |
      Inspect particle four, a reconstructed primary muon candidate.
      Compare its point count with the rows selected from the event array.
      Size counts points; it is not a physical length. Coordinates here are
      in centimeters. Try another particle and compare the properties and plot.
      Remember that the displayed species are reconstruction labels, not identities
      established by looking at the geometry alone.
  - id: inspect-interactions
    section: inspect-interactions
    text: |
      Follow particle four to interaction one. Read its full particle list,
      then compare it with the primary list. Six particles belong to this
      interaction, but only three are primary. Find the other three in the output.
      The topology summarizes valid primary candidates, not every constituent
      and not the physical interaction mode.
  - id: selection
    section: selection
    text: |
      Our selection asks for exactly one valid primary muon candidate.
      Read each condition before running it. Then remove only the primary
      requirement and predict which additional interaction will pass.
      The stored objects have not changed; your question about them has.
      That distinction is central to understanding what an analysis selection means.
