apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-spine-learn
  namespace: spine-learn
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-spine-learn
  namespace: spine-learn
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-spine-learn
subjects:
- kind: ServiceAccount
  name: argocd-application-controller
  namespace: argocd
