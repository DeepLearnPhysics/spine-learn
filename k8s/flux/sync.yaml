# Optional: apply only after S3DF confirms Flux controllers watch this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spine-learn-reconciler
  namespace: spine-learn
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spine-learn-reconciler
  namespace: spine-learn
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spine-learn-reconciler
  namespace: spine-learn
subjects:
  - kind: ServiceAccount
    name: spine-learn-reconciler
    namespace: spine-learn
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spine-learn-reconciler
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: spine-learn
  namespace: spine-learn
spec:
  interval: 2m
  url: oci://ghcr.io/deeplearnphysics/spine-learn-deploy
  ref:
    tag: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spine-learn
  namespace: spine-learn
spec:
  interval: 2m
  retryInterval: 1m
  timeout: 3m
  path: ./
  prune: true
  # Do not wait for HTTPRoute Ready; routing uses Accepted/ResolvedRefs conditions.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: spine-learn
      namespace: spine-learn
  serviceAccountName: spine-learn-reconciler
  sourceRef:
    kind: OCIRepository
    name: spine-learn
