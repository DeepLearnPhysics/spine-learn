apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spine-learn
spec:
  # S3DF's Kyverno policy injects parentRefs. This public site requires no S3DF login.
  hostnames:
    - spine-learn.slac.stanford.edu
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: spine-learn
          port: 8080
